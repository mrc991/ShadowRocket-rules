name: Update Shadowrocket Rules

    on:
      schedule:
        # 每天北京时间 12:00 (UTC 04:00) 自动同步
        - cron: '0 4 * * *'
      workflow_dispatch:

    permissions:
      contents: write

    jobs:
      update-rules:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4

          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'

          - name: Run build and merge scripts
            run: |
              python scripts/build_shadowrocket_conf.py
              python scripts/merge_johnshall.py

          - name: Commit and push changes
            run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"
              git add Custom_Shadowrocket.conf Custom_Shadowrocket_whitelist_ad.conf
              if git diff --staged --quiet; then
                echo "No changes detected. Rules are up to date."
              else
                git commit -m "chore: auto-update Shadowrocket configs [skip ci]"
                git push
              fi
