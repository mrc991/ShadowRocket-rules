name: Update Shadowrocket Rules

on:
  schedule:
    # 每天北京时间 12:00 (UTC 04:00)
    - cron: "0 4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [openclash_updated]

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run build and merge scripts
        run: |
          python scripts/build_shadowrocket_conf.py
          python scripts/merge_johnshall.py
          python scripts/test_invariants.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Custom_Shadowrocket.conf Custom_Shadowrocket_whitelist_ad.conf
          if git diff --staged --quiet; then
            echo "No changes detected. Rules are up to date."
          else
            git commit -m "chore: auto-update Shadowrocket configs [skip ci]"
            git push
          fi
